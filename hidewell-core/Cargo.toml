[package]
name = "hidewell-core"
version = "1.0.0"
description = "Cryptographic core of the Hidewell encrypted vault: pattern KDF, hidden key slots, padded container, phrase-keyed backup."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
# Deterministic software HardwareOracle for tests. Refuses to compile in release builds.
mock-oracle = []
# Exposes crate-private decoders to the libFuzzer targets in ../fuzz (implies mock-oracle,
# so it is refused in release builds too).
fuzzing = ["mock-oracle"]

[dependencies]
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes", "alloc", "zeroize"] }
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "zeroize"] }
bip39 = { version = "3.0.0", default-features = false, features = ["std", "zeroize"] }
chacha20 = { version = "0.10.2", features = ["rng", "zeroize"] }
getrandom = "0.4.3"
hkdf = "0.13.0"
hmac = { version = "0.13.0", features = ["zeroize"] }
hpke = { version = "0.14.1", default-features = false, features = ["alloc", "x25519", "hkdfsha2", "aes", "getrandom"] }
p256 = { version = "0.14.0", default-features = false, features = ["arithmetic", "hash2curve"] }
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
rand_core = "0.10.1"
region = "4.0.1"
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
sha2 = { version = "0.11.1", features = ["zeroize"] }
subtle = "2.6.1"
zeroize = { version = "1.9.1", features = ["zeroize_derive"] }

[dev-dependencies]
hex = "0.4.3"
proptest = "1.12.0"
hidewell-core = { path = ".", features = ["mock-oracle"] }
