name: fuzz

# Nightly libFuzzer campaign over the untrusted-input decoders (fuzz/).
# Not part of the push pipeline: fuzzing is time-bounded and a short run adds
# little coverage. The corpus is cached between runs so coverage accumulates;
# crash artifacts are uploaded when a target fails.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      duration:
        description: Seconds per target
        default: '600'
        required: false

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain (nightly)
        run: rustup toolchain install nightly --profile minimal

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-fuzz
            fuzz/target
          key: fuzz-build-${{ runner.os }}-${{ hashFiles('fuzz/Cargo.lock') }}

      - name: cargo-fuzz
        run: command -v cargo-fuzz >/dev/null || cargo install cargo-fuzz --locked

      - name: Restore corpus
        uses: actions/cache/restore@v6
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-

      - name: Fuzz
        run: scripts/fuzz.sh "${{ github.event.inputs.duration || '600' }}"

      - name: Save corpus
        if: always()
        uses: actions/cache/save@v6
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore
