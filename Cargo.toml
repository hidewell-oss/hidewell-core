[workspace]
resolver = "3"
members = ["hidewell-core", "hidewell-ffi", "uniffi-bindgen"]
# libFuzzer targets (nightly only); see scripts/fuzz.sh.
exclude = ["fuzz"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hidewell-oss/hidewell-core"
rust-version = "1.85"

[profile.release]
lto = true
codegen-units = 1

# Optimised build that keeps debug assertions, so the (test-only) mock oracle compiles.
# Used by the unlock benchmark; never for shipping artifacts.
[profile.perf]
inherits = "release"
debug-assertions = true
